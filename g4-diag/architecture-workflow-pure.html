<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aw-aiguard Architecture Workflow (Static)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-color: #f8f9fa;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #333; text-align: center; margin-bottom: 1rem; }
        p { color: #666; text-align: center; margin-bottom: 2rem; }
        svg { width: 100%; height: auto; border: 1px solid #eee; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>aw-aiguard High Level Architecture</h1>
        <p>Pure SVG implementation — works offline and requires no JavaScript.</p>
        
        <svg viewBox="0 0 800 1250" xmlns="http://www.w3.org/2000/svg">
            <!-- Arrowhead Definition -->
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
                </marker>
            </defs>

            <!-- BACKGROUND GROUPS (Subgraphs) -->
            <rect x="20" y="140" width="760" height="110" rx="15" fill="#f3e5f5" stroke="#4a148c" stroke-dasharray="5,5" opacity="0.3" />
            <text x="30" y="160" font-weight="bold" fill="#4a148c" font-size="14">Layer 0: Data Ingestion & Provenance</text>

            <rect x="20" y="270" width="760" height="180" rx="15" fill="#e1f5fe" stroke="#01579b" stroke-dasharray="5,5" opacity="0.3" />
            <text x="30" y="290" font-weight="bold" fill="#01579b" font-size="14">Layer 1: Pre-Flight Guardrails (Real-Time)</text>

            <rect x="20" y="470" width="760" height="180" rx="15" fill="#fffde7" stroke="#fbc02d" stroke-dasharray="5,5" opacity="0.3" />
            <text x="30" y="490" font-weight="bold" fill="#fbc02d" font-size="14">Layer 2: Human-in-the-Loop (HITL)</text>

            <rect x="20" y="670" width="760" height="110" rx="15" fill="#e8f5e9" stroke="#2e7d32" stroke-dasharray="5,5" opacity="0.3" />
            <text x="30" y="690" font-weight="bold" fill="#2e7d32" font-size="14">External LLMs</text>

            <rect x="20" y="800" width="760" height="150" rx="15" fill="#fff3e0" stroke="#ef6c00" stroke-dasharray="5,5" opacity="0.3" />
            <text x="30" y="820" font-weight="bold" fill="#ef6c00" font-size="14">Layer 3: Post-Response Verification</text>

            <!-- NODES -->
            <!-- Start -->
            <rect x="300" y="20" width="200" height="60" rx="30" fill="#eee" stroke="#666" />
            <text x="400" y="55" text-anchor="middle" font-size="14">User / AI Agent</text>

            <!-- Proxy -->
            <rect x="300" y="100" width="200" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="2" />
            <text x="400" y="135" text-anchor="middle" font-size="14" font-weight="bold">Guardrail Proxy Gateway</text>

            <!-- Layer 0 -->
            <rect x="300" y="170" width="200" height="60" rx="5" fill="#f3e5f5" stroke="#4a148c" />
            <text x="400" y="205" text-anchor="middle" font-size="12">Provenance Tagging</text>
            
            <rect x="550" y="170" width="150" height="60" rx="5" fill="#fff" stroke="#666" />
            <text x="625" y="205" text-anchor="middle" font-size="12">Context / RAG Store</text>

            <!-- Layer 1 -->
            <rect x="200" y="300" width="180" height="60" rx="5" fill="#fff" stroke="#666" />
            <text x="290" y="335" text-anchor="middle" font-size="12">PII & Secrets Scanner</text>

            <rect x="420" y="300" width="180" height="60" rx="5" fill="#e1f5fe" stroke="#01579b" />
            <text x="510" y="335" text-anchor="middle" font-size="12">Guardian Fast Mode</text>

            <rect x="420" y="380" width="180" height="60" rx="5" fill="#fff" stroke="#666" />
            <text x="510" y="415" text-anchor="middle" font-size="12">CaMeL Schema Validation</text>

            <!-- Layer 2 -->
            <polygon points="400,480 520,530 400,580 280,530" fill="#fffde7" stroke="#fbc02d" />
            <text x="400" y="535" text-anchor="middle" font-size="12">Irreversible Action?</text>

            <rect x="300" y="600" width="200" height="60" rx="5" fill="#fff4dd" stroke="#d4a017" stroke-width="2" />
            <text x="400" y="635" text-anchor="middle" font-size="12">HITL Approval Gate</text>

            <!-- External LLM -->
            <rect x="300" y="700" width="200" height="60" rx="5" fill="#e8f5e9" stroke="#2e7d32" />
            <text x="400" y="735" text-anchor="middle" font-size="12">Cloud LLM API</text>

            <!-- Layer 3 -->
            <rect x="300" y="830" width="200" height="60" rx="5" fill="#fff" stroke="#666" />
            <text x="400" y="865" text-anchor="middle" font-size="12">Output Control</text>

            <rect x="300" y="910" width="200" height="60" rx="5" fill="#e1f5fe" stroke="#01579b" />
            <text x="400" y="945" text-anchor="middle" font-size="12">Guardian Thinking Mode</text>

            <!-- End / Block -->
            <rect x="600" y="1000" width="150" height="60" rx="5" fill="#f96" stroke="#333" stroke-width="2" />
            <text x="675" y="1035" text-anchor="middle" font-size="14" font-weight="bold">BLOCK Execution</text>

            <rect x="300" y="1000" width="200" height="60" rx="30" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
            <text x="400" y="1035" text-anchor="middle" font-size="14" font-weight="bold">Final Verified Output</text>

            <!-- Audit -->
            <rect x="600" y="120" width="150" height="60" rx="5" fill="#fcfcfc" stroke="#aaa" />
            <text x="675" y="145" text-anchor="middle" font-size="11">Postgres Hot Tier</text>

            <!-- LINES / ARROWS -->
            <line x1="400" y1="80" x2="400" y2="99" stroke="#666" marker-end="url(#arrowhead)" />
            <line x1="400" y1="160" x2="400" y2="169" stroke="#666" marker-end="url(#arrowhead)" />
            <line x1="500" y1="200" x2="549" y2="200" stroke="#666" marker-end="url(#arrowhead)" />

            <!-- To Layer 1 -->
            <line x1="400" y1="160" x2="290" y2="300" stroke="#666" marker-end="url(#arrowhead)" />
            <line x1="400" y1="160" x2="420" y2="300" stroke="#666" marker-end="url(#arrowhead)" />

            <!-- Fast Mode to Schema -->
            <line x1="510" y1="360" x2="510" y2="379" stroke="#666" marker-end="url(#arrowhead)" />
            
            <!-- Schema to Decision -->
            <line x1="510" y1="440" x2="450" y2="480" stroke="#666" marker-end="url(#arrowhead)" />

            <!-- Decision to HITL -->
            <line x1="400" y1="580" x2="400" y2="599" stroke="#666" marker-end="url(#arrowhead)" />
            <text x="410" y="590" font-size="10">Yes</text>

            <!-- Decision to LLM (No HITL) -->
            <line x1="280" y1="530" x2="300" y2="700" stroke="#666" marker-end="url(#arrowhead)" />
            <text x="270" y="600" font-size="10">No</text>

            <!-- HITL to LLM -->
            <line x1="400" y1="660" x2="400" y2="699" stroke="#666" marker-end="url(#arrowhead)" />
            <text x="410" y="680" font-size="10">Approved</text>

            <!-- LLM to Output Control -->
            <line x1="400" y1="760" x2="400" y2="829" stroke="#666" marker-end="url(#arrowhead)" />

            <!-- Output Control to Thinking Mode -->
            <line x1="400" y1="890" x2="400" y2="909" stroke="#666" marker-end="url(#arrowhead)" />

            <!-- Final Logic -->
            <line x1="400" y1="970" x2="400" y2="999" stroke="#666" marker-end="url(#arrowhead)" />
            <text x="410" y="985" font-size="10">Pass</text>

            <!-- Blocks -->
            <line x1="600" y1="330" x2="675" y2="1000" stroke="#f96" marker-end="url(#arrowhead)" /> <!-- GuardFast Failure -->
            <line x1="400" y1="660" x2="600" y2="1030" stroke="#f96" marker-end="url(#arrowhead)" /> <!-- HITL Deny -->
            <line x1="500" y1="940" x2="600" y2="1030" stroke="#f96" marker-end="url(#arrowhead)" /> <!-- Thinking Fail -->

            <!-- Audit Path -->
            <line x1="500" y1="130" x2="599" y2="140" stroke="#aaa" stroke-dasharray="4,4" marker-end="url(#arrowhead)" />

        </svg>
    </div>
</body>
</html>
