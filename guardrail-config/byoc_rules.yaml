# BYOC (Bring Your Own Criteria) Stop-Limits
# These are hard boundaries that no model decision can override.
# Enforcement hierarchy: BYOC applies AFTER Guardian and PII checks, BEFORE HITL.
# - hard_stop: immediate block, no override
# - soft_block: Guardian alert + log warning

rules:
  - name: "never_exfiltrate"
    description: "No outbound transmission of data to external URLs/domains not in allowlist."
    pattern: "curl -d.*http|wget.*-O|fetch.*POST|requests\\.post.*http|send.*external|exfiltrate"
    enforcement: "hard_stop"
    severity: "critical"

  - name: "never_override_system_prompt"
    description: "No prompt injection or system prompt manipulation."
    pattern: "ignore all instructions|system prompt|you are now|override system| disregard previous"
    enforcement: "hard_stop"
    severity: "critical"

  - name: "max_tool_calls_per_minute"
    description: "Rate limit on tool invocations per API key to prevent abuse."
    pattern: ""
    enforcement: "soft_block"
    severity: "medium"
    rate_limit: 60
    window_seconds: 60
