[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aw-aiguard"
version = "0.3.0"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["gateway*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::PendingDeprecationWarning:starlette.formparsers",
]
markers = [
    "unit: Unit tests that mock all external dependencies",
    "integration: Tests that require external services (Postgres, mock servers)",
    "slow: Tests that take longer than 1 second",
]

[tool.coverage.run]
source = ["gateway", "central_service", "shared"]
omit = ["*/main.py", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "FUTURE:",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["F", "I", "UP", "FA", "RUF012", "SIM", "PLR1722", "EXE001"]
ignore = [
    # Broad except at trust boundaries is a deliberate fail-safe in security middleware.
    # Narrowing to specific exceptions risks allowing unvalidated requests through.
    "BLE001",
    # try/except/pass is intentional for silent failure modes (e.g. background cleanup loops).
    "S110",
    # contextlib.suppress is less readable for async cancellation patterns.
    "SIM105",
    # Nested `with` is clearer for asyncpg pool+cursor/transaction semantics.
    "SIM117",
    # Nested `if` preserves readability when each guard has a distinct intent.
    "SIM102",
    # PEP 604 union (X | None) not supported at runtime on Python 3.9 without eval_type_backport.
    "UP045",
]

[tool.ruff.lint.isort]
force-single-line = false
