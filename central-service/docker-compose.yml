version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: aw-aiguard-postgres
    environment:
      POSTGRES_DB: aw_aiguard
      POSTGRES_USER: aiguard
      POSTGRES_PASSWORD: aiguard_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiguard -d aw_aiguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aw-aiguard-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aiguard
      MINIO_ROOT_PASSWORD: aiguard_local_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_server:
    build:
      context: ..
      dockerfile: central-service/Dockerfile
    container_name: aw-aiguard-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://aiguard:***@postgres:5432/aw_aiguard
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=aiguard
      - MINIO_SECRET_KEY=aiguard_local_dev
      - AUDIT_TTL_DAYS=30
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TO=${SMTP_TO:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../guardrail-config:/app/guardrail-config:ro

volumes:
  pgdata:
  miniodata:
